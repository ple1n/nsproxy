[workspace]
members = [
    "crates/*"
]
resolver = "3"

[profile.dev.package.term-view]
opt-level = 3

[profile.dev.package.egui]
opt-level = 3

[profile.dev.package.eframe]
opt-level = 3

[profile.dev.package.epaint]
opt-level = 3

[profile.dev.package.egui_extras]
opt-level = 3

[profile.dev.package.egui_plot]
opt-level = 3

[profile.dev.package.egui_code_editor]
opt-level = 3

[profile.dev.package.egui-phosphor]
opt-level = 3

[profile.dev.package.egui_json_tree]
opt-level = 3

[profile.dev.package.egui_sgr]
opt-level = 3

[workspace.package]
version = "0.3.5"
edition = "2021"
repository = "https://github.com/ple1n/nsproxy"

[profile.dev]
panic = "abort"
opt-level = 0       # No optimizations → fastest compile
debug = true        # Keep debug symbols
incremental = true  # Enable incremental builds
codegen-units = 16  
lto = false         # No link-time optimization

[profile.release]
strip = false
opt-level = 3
lto = true
debug = true
# Just strip manually


[patch.crates-io]
nsproxy-hickory-proto = { path = "../hickory-dns/crates/proto" }
nsproxy-hickory-client = { path = "../hickory-dns/crates/client" }
nsproxy-hickory-resolver = { path = "../hickory-dns/crates/resolver" }
nsproxy-hickory-recursor = { path = "../hickory-dns/crates/recursor" }
nsproxy-hickory-server = { path = "../hickory-dns/crates/server" }
nsproxy-hickory-dns = { path = "../hickory-dns/bin" }
nsproxy-hickory-util = { path = "../hickory-dns/util" }

[workspace.dependencies]
tun-rs = { version = "2.7.2", features = ["async_io"] }
flume = "0.11.1"
rust-tun = { path = "crates/rust-tun" }
netlink-ops = { path = "crates/netlink-ops" }
rtnetlink = { path = "crates/rtnetlink" }
rustables = { path = "crates/rustables" }
netlink-packet-audit = { path = "crates/netlink-packet-audit" }
netlink-sys = { path = "crates/netlink-sys" }
netlink-proto = { path = "crates/netlink-proto" }
tun2socks5 = { path = "crates/tun2socks5" }
socks5-impl = { path = "crates/socks5-impl" }
pidfd = { path = "crates/pidfd" }
ipstack = { path = "crates/ipstack" }
clone3 = { path = "crates/clone3" }
nsproxy-ui = { path = "crates/nsproxy-ui" }
netlink-packet-route = { path = "crates/netlink-packet-route" }
netlink-packet-utils = { path = "crates/netlink-packet-utils" }
netlink-packet-core = { path = "crates/netlink-packet-core" }
fs4 = { version = "0.13", features = ["tokio"] }
rlimit = "0.10.1"
passfd = { version = "*" }
which = "8.0.0"
chrono = "0.4"

# daemonize-me = "2.0.1"
