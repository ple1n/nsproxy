[package]
name = "term-view"
version.workspace = true
edition.workspace = true
build = "src/alacritty_port/build.rs"

[features]
default = ["egui-renderer", "alacritty-opengl"]
egui-renderer = []
alacritty-opengl = [
	"dep:winit",
	"dep:glutin",
	"dep:crossfont",
	"dep:copypasta",
	"dep:parking_lot",
	"dep:unicode-width",
	"dep:serde",
	"dep:serde_json",
	"dep:ahash",
	"dep:bitflags",
	"dep:clap",
	"dep:home",
	"dep:libc",
	"dep:log",
	"dep:notify",
	"dep:polling",
	"dep:signal-hook",
	"dep:tempfile",
	"dep:toml",
	"dep:toml_edit",
	"dep:serde_yaml",
	"dep:alacritty_config",
	"dep:alacritty_config_derive",
	"dep:xdg",
	"dep:png",
]

[dependencies]
egui = "0.33.3"
flume = "0.11.1"
alacritty_terminal = "0.25.1"
winit = { version = "0.30.12", features = ["serde"], optional = true }
glutin = { version = "0.32.2", default-features = false, features = ["egl", "wgl"], optional = true }
crossfont = { version = "0.8.1", optional = true }
copypasta = { version = "0.10.1", default-features = false, optional = true }
parking_lot = { version = "0.12.0", optional = true }
unicode-width = { version = "0.2.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ahash = { version = "0.8.6", features = ["no-rng"], optional = true }
bitflags = { version = "2.2.1", optional = true }
clap = { version = "4.2.7", features = ["derive", "env"], optional = true }
home = { version = "0.5.5", optional = true }
libc = { version = "0.2", optional = true }
log = { version = "0.4", features = ["std", "serde"], optional = true }
notify = { version = "8.0.0", optional = true }
polling = { version = "3.7.4", optional = true }
signal-hook = { version = "0.4.3", default-features = false, optional = true }
tempfile = { version = "3.12.0", optional = true }
toml = { version = "0.9.11", optional = true }
toml_edit = { version = "0.24.0", optional = true }
serde_yaml = { version = "0.9.25", optional = true }
alacritty_config = { version = "0.2.3", optional = true }
alacritty_config_derive = { version = "0.2.5", optional = true }
xdg = { version = "3.0.0", optional = true }
png = { version = "0.17.5", default-features = false, optional = true }

[build-dependencies]
gl_generator = "0.14.0"
