[package]
name = "clash-bootstrap"
version = "0.9.4"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Watfaq/clash-rs"
description = "Minimal DNS bootstrap resolver for Clash proxy servers"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "io-util", "time", "sync"] }
trust-dns-resolver = "0.23.2"
trust-dns-proto = "0.23"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
ipnet = "2.9"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "simple_resolve"
path = "examples/simple_resolve.rs"
