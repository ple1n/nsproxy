[package]
name = "nsproxy-core"
version = "3.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
ipnetwork = { version = "0.21.1", features = ["serde"] }
tokio = "1.47.1"
toml_edit = { version = "0.23.4", features = ["serde"] }
tun2socks5.workspace = true
rtnetlink = { path = "../rtnetlink" }
futures = "0.3.31"
futures-util = "0.3.31"
serde = "1.0.219"
serde_json = "1.0.143"
clap = "4.5.46"
clap_complete = "4.5.57"
nsproxy-common = { version = "0.1.0", path = "../common" }
nix = { version = "0.27.1", features = [
    "sched",
    "net",
    "mount",
    "env",
    "hostname",
    "user",
    "ioctl",
    "signal",
] }
tracing = "0.1.41"
libc = "0.2.175"
uzers = "0.12.1"
capctl = "0.2.3"
rand = "0.9.2"
pidfd = { workspace = true }
fs4 = { workspace = true }
serde-untagged = "0.1.8"
rlimit = { workspace = true }
smol = "2.0.2"
futures-lite = "2.6.1"
futures_codec = "0.4.1"
procfs = "=0.18.0"
clone3.path = "../clone3"
passfd.workspace = true
tracing-subscriber = "0.3.20"
which.workspace = true
multimap = "0.10.1"
notify = "8.2.0"
notify-rust = "4"
warp = { path = "../warp", features = ["server"] }
hyper-util = { version = "0.1.12", features = [
    "server",
    "server-graceful",
    "server-auto",
    "http1",
    "http2",
    "service",
    "tokio",
] }
hardware-address = { version = "0.2.0", features = ["std"] }
atty = "0.2.14"
strum = { version = "0.27.2", features = ["derive"] }
socks5-impl = { path = "../socks5-impl" }
reqwest = { version = "0.12.23", features = ["socks"] }
tokio-send-fd = "0.9.4"
blake3 = "1.5.1"
diag = { path = "../diag" }
clash-config = { path = "../clash-config" }
trojan-proto = { path = "../trojan-proto" }
tokio-rustls = "0.26"
rustls = { version = "0.23.23", features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "0.6"
rustls-pki-types = "1.10"
webpki-roots = "0.26"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
url = "2.5"
owo-colors = "3.5.0"
h2 = "0.4"
http = "1.2"
# Integrated from tun2socks5
async-recursion = "1.0"
async-trait = "0.1"
base64 = "0.21"
digest_auth = "0.3"
httparse = "1.8"
trust-dns-proto = "0.23"
unicase = "2.7"
id_alloc = { path = "../id_alloc" }
quick_cache = "0.6.3"
concurrent-map = "5.0.37"
crossbeam = "0.8.4"
bimap = { version = "0.6.3", features = ["serde"] }
twox-hash = { version = "=2.1.2", features = ["xxhash3_128"] }
ipstack.workspace = true
flume.workspace = true
tun-rs.workspace = true
thiserror = "1.0"
ctrlc2 = { version = "3.5", features = ["tokio", "termination"] }

[lints.clippy]
all = "allow"