[package]
name = "nsproxy-ui"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
egui = "0.33.3"
eframe = "0.33.3"
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread", "sync", "signal", "time", "process", "io-util"] }
tracing = "0.1.44"
nsproxy-common = { version = "0.1.0", path = "../common" }
flume = "0.11.1"
egui_extras = "0.33"
egui_json_tree = "0.14.2"
nsproxy-core = { path = "../nsproxy-core" }
diag = { path = "../diag" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.27.1", features = ["process", "signal"] }
libc = "0.2"
egui_plot = "0.34.1"
bincode = "1.3"
egui_code_editor = "0.2.20"
egui-phosphor = "0.11"
which.workspace = true
egui_sgr = "0.1.6"
rand = "0.8"
futures = "0.3"
shlex = "1.3"
alacritty_terminal = "0.25.1"
smallstr = "0.3.1"
