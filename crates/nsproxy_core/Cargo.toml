[package]
name = "nsproxy_core"
version = "3.1.3"
edition = "2024"

[profile.release]
opt-level = "s"

[dependencies]
anyhow = "1.0.99"
ipnetwork = { version = "0.21.1", features = ["serde"] }
tokio = "1.47.1"
toml_edit = { version = "0.23.4", features = ["serde"] }
tun2socks5.workspace = true
rtnetlink = { path = "../rtnetlink" }
futures = "0.3.31"
futures-util = "0.3.31"
serde = "1.0.219"
serde_json = "1.0.143"
clap = "4.5.46"
nsproxy-common = { version = "0.1.0", path = "../common" }
nix = { version = "0.27.1", features = [
    "sched",
    "net",
    "mount",
    "env",
    "hostname",
    "user",
    "ioctl",
    "signal",
] }
tracing = "0.1.41"
libc = "0.2.175"
uzers = "0.12.1"
capctl = "0.2.3"
rand = "0.9.2"
pidfd = { workspace = true }
fs4 = { workspace = true }
serde-untagged = "0.1.8"
rlimit = { workspace = true }
smol = "2.0.2"
futures-lite = "2.6.1"
futures_codec = "0.4.1"
procfs = "=0.18.0"
clone3.path = "../clone3"
passfd.workspace = true
tracing-subscriber = "0.3.20"
which.workspace = true
multimap = "0.10.1"
notify = "8.2.0"
notify-rust = "4"
warp = { path = "../warp", features = ["server"] }
hyper-util = { version = "0.1.12", features = [
    "server",
    "server-graceful",
    "server-auto",
    "http1",
    "http2",
    "service",
    "tokio",
] }
hardware-address = { version = "0.2.0", features = ["std"] }
atty = "0.2.14"
strum = { version = "0.27.2", features = ["derive"] }
