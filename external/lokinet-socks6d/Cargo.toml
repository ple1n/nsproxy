[package]
name = "lokinet-socks6d"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "User-launched SOCKS6 daemon backed by Lokinet"

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1"
clap = { version = "4.5.46", features = ["derive"] }
rs-lokinet = { package = "rs-lokinet", path = "../lokinet/rust/rs-lokinet" }
socks6 = { path = "../socks6" }
nsproxy-ipstack = { path = "../../crates/ipstack" }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
